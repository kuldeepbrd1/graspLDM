[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp_ldm"
version = "0.0.1"
description = "Generative 6-DoF Grasp Synthesis using Latent Diffusion Models"
authors = [{ name = "Kuldeep Barad" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "addict>=2.4.0",
    "certifi",
    "diffusers>=0.30.0",
    "einops>=0.7.0",
    "h5py>=3.10.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
    "pytorch-lightning>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "shapely>=2.0.0",
    "six>=1.16.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torcheval>=0.0.7",
    "tqdm>=4.66.0",
    "trimesh>=4.0.0",
    "yapf>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "tools*", "data_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast CPU-only unit tests",
    "integration: model forward pass tests with dummy data (CPU)",
    "smoke: config loading and instantiation tests",
]
addopts = "-v --tb=short"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
